spring.application.name=t3l-restaurant
spring.config.import=optional:file:.env[.properties]
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.port=${SERVER_PORT:8085}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/t3l_restaurant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/t3l_restaurant}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
app.staff.username=${APP_STAFF_USERNAME:staff}
app.staff.password=${APP_STAFF_PASSWORD:Staff@123}
app.buyer.username=${APP_BUYER_USERNAME:buyer}
app.buyer.password=${APP_BUYER_PASSWORD:Buyer@123}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.reservations.opening-time=10:00
app.reservations.closing-time=22:00
app.reservations.duration-minutes=120
app.reservations.slot-minutes=30
app.reservations.time-zone=Asia/Ho_Chi_Minh
app.restaurant.address=${RESTAURANT_ADDRESS:6 L\u00ea L\u1ee3i, ph\u01b0\u1eddng 4, qu\u1eadn G\u00f2 V\u1ea5p, th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh}
app.restaurant.phone=${RESTAURANT_PHONE:0342162519}
app.restaurant.email=${RESTAURANT_EMAIL:T3LRestaurant@gmail.com}
