spring.application.name=t3l-restaurant
spring.config.import=optional:file:.env[.properties]
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.port=${SERVER_PORT:8085}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/t3l_restaurant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.compression.enabled=true
server.compression.mime-types=text/css,text/javascript,application/javascript
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=8000
spring.mail.properties[mail.smtp.writetimeout]=8000
app.reservation-mail.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}
app.deposits.payment-minutes=${DEPOSIT_PAYMENT_MINUTES:120}
app.deposits.review-minutes=${DEPOSIT_REVIEW_MINUTES:120}
app.deposits.full-refund-notice-minutes=${DEPOSIT_FULL_REFUND_NOTICE_MINUTES:1440}
app.deposits.late-refund-percent=${DEPOSIT_LATE_REFUND_PERCENT:50}
app.deposits.no-show-refund-percent=${DEPOSIT_NO_SHOW_REFUND_PERCENT:0}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/t3l_restaurant}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
app.staff.username=${APP_STAFF_USERNAME:staff}
app.staff.password=${APP_STAFF_PASSWORD:Staff@123}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.sms.api-key=${ESMS_API_KEY:}
app.sms.secret-key=${ESMS_SECRET_KEY:}
app.sms.brandname=${ESMS_BRANDNAME:}
app.sms.template=${ESMS_OTP_TEMPLATE:}
app.sms.local-enabled=${SMS_OTP_LOCAL_ENABLED:false}
app.sms.local-phone=${SMS_OTP_LOCAL_PHONE:0900000000}
app.jwt.secret=${APP_JWT_SECRET}
app.tracking.enabled=${TRACKING_ENABLED:true}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.reservations.opening-time=10:00
app.reservations.closing-time=22:00
app.reservations.duration-minutes=120
app.reservations.slot-minutes=30
app.reservations.time-zone=Asia/Ho_Chi_Minh
app.restaurant.address=${RESTAURANT_ADDRESS:6 L\u00ea L\u1ee3i, ph\u01b0\u1eddng 4, qu\u1eadn G\u00f2 V\u1ea5p, th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh}
app.restaurant.phone=${RESTAURANT_PHONE:0342162519}
app.restaurant.email=${RESTAURANT_EMAIL:T3LRestaurant@gmail.com}
app.chat.api-key=${GEMINI_API_KEY:}
app.chat.model=${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
app.chat.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.chat.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
app.chat.vector-uri=${CHAT_VECTOR_MONGODB_URI:}
app.chat.timeout-seconds=${CHAT_GEMINI_TIMEOUT_SECONDS:6}
app.chat.calls-per-day=${CHAT_GEMINI_CALLS_PER_DAY:250}
app.chat.requests-per-minute=${CHAT_REQUESTS_PER_MINUTE:8}
sepay.enabled=${SEPAY_ENABLED:false}
sepay.api-token=${SEPAY_API_TOKEN:}
sepay.bank-name=${SEPAY_BANK_NAME:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
sepay.payment-mode=${SEPAY_PAYMENT_MODE:POLLING}
sepay.poll-interval-ms=${SEPAY_POLL_INTERVAL_MS:5000}
sepay.demo-enabled=${SEPAY_DEMO_ENABLED:false}
sepay.api-base-url=${SEPAY_API_BASE_URL:https://userapi.sepay.vn/v2}
sepay.invoice-payment-minutes=${SEPAY_INVOICE_PAYMENT_MINUTES:120}
