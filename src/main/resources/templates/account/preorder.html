<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Chỉnh sửa món đặt trước | T3L Restaurant</title>
    <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/account.css}" />
    <link rel="stylesheet" th:href="@{/css/preorder.css(v=2)}" />
    <script data-page-script th:src="@{/js/preorder.js(v=2)}" defer></script>
    <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
  </head>
  <body class="home account-page">
    <a class="skip-link" href="#account-content">Chuyển đến nội dung</a>
    <header th:replace="~{web/fragments/restaurant-shell :: header('account')}"></header>
    <main class="account-area" id="main" aria-labelledby="account-title">
        <div class="account-content preorder-page account-stack" id="account-content" tabindex="-1">
          <header class="account-heading">
            <a class="account-text-action" th:href="@{/reservations/lookup(code=${booking.code})} + '#booking-order'">← Chi tiết đặt bàn</a>
            <h1 id="account-title">Chỉnh sửa món đặt trước</h1>
            <p class="account-muted" th:text="${booking.code + ' · ' + #temporals.format(booking.startsAt,'dd/MM/yyyy HH:mm') + ' · ' + booking.statusLabel}"></p>
          </header>
          <form class="account-form" th:action="@{/account/reservations/{code}/preorder(code=${booking.code})}" th:object="${preorderForm}" method="post"
                th:attr="data-unsaved=${#fields.hasErrors('*')}">
            <div class="account-notice is-error" role="alert" th:if="${#fields.hasErrors('*')}">
              <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
            </div>
            <section th:replace="~{web/fragments/preorder-picker :: picker(${preorderCards},${minimumDeposit},${booking},${preorderForm.preorderNote})}"></section>
          </form>
        </div>
    </main>
    <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>
    <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
  </body>
</html>
