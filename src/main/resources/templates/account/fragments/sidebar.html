<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
  <span class="sidebar-account-label" th:fragment="label(name, role)">
    <strong th:text="${name}"></strong>
    <small th:text="${role}"></small>
  </span>
  <aside th:fragment="customer(active, fallbackName)" class="account-sidebar">
    <div class="account-identity" th:with="name=${customerBadge != null ? customerBadge.name : fallbackName}">
      <th:block th:if="${customerBadge != null}">
        <span th:replace="~{account/fragments/navigation :: avatar}"></span>
      </th:block>
      <span class="customer-avatar" aria-hidden="true" th:unless="${customerBadge != null}"
          th:text="${name != null and !name.isEmpty() ? #strings.toUpperCase(#strings.substring(name,0,1)) : 'T'}"></span>
      <span th:replace="~{account/fragments/sidebar :: label(${name}, 'Khách hàng')}"></span>
    </div>
    <nav class="account-nav" aria-label="Điều hướng tài khoản">
      <th:block th:replace="~{account/fragments/navigation :: links(${active})}"></th:block>
    </nav>
  </aside>
  <div class="sidebar-employee" th:fragment="employee" th:if="${sidebarEmployee != null}">
    <span th:replace="~{account/fragments/sidebar :: label(${sidebarEmployee.name}, ${sidebarEmployee.role})}"></span>
    <form th:action="@{/logout}" method="post">
      <button class="sidebar-signout" type="submit" title="Đăng xuất" aria-label="Đăng xuất">
        <svg th:replace="~{account/fragments/navigation :: icon('logout')}"></svg>
      </button>
    </form>
  </div>
</body>
</html>
