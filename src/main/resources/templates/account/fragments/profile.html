<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="fields(requirePhone)" class="account-fields">
      <div class="account-field">
        <label for="familyName">Họ</label>
        <input th:field="*{familyName}" autocomplete="family-name" maxlength="120" />
        <small th:errors="*{familyName}"></small>
      </div>
      <div class="account-field">
        <label for="givenName">Tên</label>
        <input th:field="*{givenName}" autocomplete="given-name" maxlength="120" required />
        <small th:errors="*{givenName}"></small>
      </div>
      <small class="account-error account-full" th:errors="*{fullNameWithinLimit}"></small>
      <div class="account-field account-full">
        <label for="email">Email <span class="account-muted">(tùy chọn)</span></label>
        <input type="email" th:field="*{email}" autocomplete="email" maxlength="254" />
        <small th:errors="*{email}"></small>
      </div>
      <div class="account-field account-full">
        <label for="phone">Số điện thoại</label>
        <input type="tel" th:field="*{phone}" autocomplete="tel" maxlength="30"
            th:required="${requirePhone and verifiedPhone == null}" th:readonly="${verifiedPhone != null}" />
        <small th:errors="*{phone}"></small>
        <small class="account-muted" th:if="${verifiedPhone != null}">Đã xác thực qua SMS</small>
      </div>
      <div class="account-field account-full">
        <label for="dietaryPreferences">Chế độ ăn đặc biệt <span class="account-muted">(tùy chọn)</span></label>
        <textarea th:field="*{dietaryPreferences}" rows="2" maxlength="500" placeholder="Ví dụ: ăn chay, dị ứng hải sản"></textarea>
        <small th:errors="*{dietaryPreferences}"></small>
      </div>
      <fieldset class="account-preferences account-full">
        <legend>Tùy chọn nhận thông báo</legend>
        <label><input type="checkbox" th:field="*{bookingNotifications}" /> Nhận thông báo về giao dịch và đặt bàn</label>
        <label><input type="checkbox" th:field="*{marketingOptIn}" /> Nhận tin về sự kiện và khuyến mãi của T3L</label>
      </fieldset>
    </div>
    <div th:fragment="content">
      <form class="account-form" method="post" th:action="@{/account}" th:object="${profileForm}">
        <div th:replace="~{account/fragments/profile :: fields(false)}"></div>
        <div class="account-form-actions"><button class="account-button is-primary" type="submit">Lưu thay đổi</button></div>
      </form>
      <section class="account-subsection" aria-labelledby="account-linked-title">
        <h2 id="account-linked-title">Phương thức đăng nhập</h2>
        <div class="account-provider">
          <span>Google</span>
          <span class="account-status" th:if="${linkedGoogleEmail != null}">Đã liên kết</span>
          <span class="account-muted" th:unless="${linkedGoogleEmail != null}">Chưa liên kết</span>
        </div>
        <p class="account-muted" th:if="${linkedGoogleEmail != null}" th:text="${linkedGoogleEmail}"></p>
        <th:block th:if="${param.google != null}" th:switch="${param.google == null ? '' : param.google[0]}">
          <p class="account-notice" role="status" th:case="'linked'">Đã liên kết tài khoản Google.</p>
          <p class="account-notice is-error" role="alert" th:case="'already-linked'">Tài khoản Google này đã được liên kết.</p>
          <p class="account-notice is-error" role="alert" th:case="'expired'">Phiên liên kết đã hết hạn. Vui lòng bắt đầu lại.</p>
          <p class="account-notice is-error" role="alert" th:case="*">Chưa thể liên kết Google. Vui lòng thử lại.</p>
        </th:block>
        <form method="post" th:if="${googleEnabled and linkedGoogleEmail == null and verifiedPhone != null}" th:action="@{/account/google/link}">
          <button class="account-button" type="submit">Liên kết với Google</button>
        </form>
        <div class="account-provider account-subsection">
          <span>Số điện thoại</span>
          <span class="account-status" th:if="${verifiedPhone != null}" th:text="${verifiedPhone}"></span>
          <span class="account-muted" th:unless="${verifiedPhone != null}">Chưa xác thực SMS</span>
        </div>
        <a class="account-text-action" th:unless="${localCustomer}" th:href="@{/account/sms}"
           th:text="${verifiedPhone == null ? 'Liên kết số điện thoại' : 'Đổi số điện thoại đã xác thực'}"></a>
      </section>
    </div>
  </body>
</html>
