<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="empty(icon, title, description)" class="account-empty">
      <span class="account-empty-icon"><svg th:replace="~{account/fragments/navigation :: icon(${icon})}"></svg></span>
      <strong th:text="${title}"></strong>
      <p th:if="${description != null}" th:text="${description}"></p>
    </div>

    <div th:fragment="reservations">
      <nav class="account-tabs" aria-label="Lịch đặt bàn">
        <a th:href="@{/account/reservations}" th:attr="aria-current=${tab == 'upcoming' ? 'page' : null}">Sắp tới</a>
        <a th:href="@{/account/reservations(tab='past')}" th:attr="aria-current=${tab == 'past' ? 'page' : null}">Đã qua</a>
      </nav>
      <th:block th:if="${bookings.isEmpty()}">
        <div th:replace="~{account/fragments/activity :: empty('reservations',${tab == 'past' ? 'Chưa có lịch đặt bàn đã qua' : 'Chưa có lịch đặt bàn sắp tới'},'Các lịch được lưu vào tài khoản sẽ hiển thị tại đây.')}"></div>
      </th:block>
      <ul class="account-list" th:unless="${bookings.isEmpty()}">
        <li class="account-record" th:each="booking : ${bookings}" th:with="order=${voucherOrders.get(booking.id)}">
          <div>
            <p class="account-record-title" th:text="${#temporals.format(booking.reservationDate, 'dd/MM/yyyy') + ' · ' + #temporals.format(booking.reservationTime, 'HH:mm')}"></p>
            <p class="account-muted" th:if="${order != null}" th:text="${'Voucher ' + order.voucherCode + ' · giảm ' + #numbers.formatInteger(order.voucherDiscount,1,'POINT') + ' đ'}"></p>
            <p class="account-muted" th:text="${booking.guestCount + ' khách · ' + booking.code}"></p>
          </div>
          <div class="account-record-actions">
            <span class="account-status" th:text="${booking.statusLabel}"></span>
            <span class="account-status" th:if="${booking.depositAmount.signum() > 0 or booking.depositPaid.signum() > 0}"
                th:text="${booking.depositStatusLabel}"></span>
            <a class="account-text-action" th:href="@{/reservations/lookup(code=${booking.code})}">Xem chi tiết</a>
            <a class="account-text-action" th:href="@{/reservations/confirmation(code=${booking.code})}">Đơn món</a>
            <a class="account-text-action" th:href="@{/account/reservations/{code}/preorder(code=${booking.code})}">Món đặt trước</a>
          </div>
        </li>
      </ul>
      <div class="account-form-actions account-spaced-actions">
        <a class="account-button" th:href="@{/reservations/lookup}">Tìm đặt bàn trước đây</a>
        <a class="account-button is-primary" th:href="@{/reservations/new}">Đặt bàn</a>
      </div>
    </div>

    <div th:fragment="orders">
      <th:block th:if="${diningOrders.isEmpty()}">
        <div th:replace="~{account/fragments/activity :: empty('orders','Chưa có đơn hàng','Các món đặt kèm bàn sẽ xuất hiện tại đây.')}"></div>
      </th:block>
      <ul class="account-list" th:unless="${diningOrders.isEmpty()}">
        <li class="account-record" th:each="order : ${diningOrders}">
          <div>
            <p class="account-record-title" th:text="${order.reservation.code}"></p>
            <p class="account-muted" th:text="${#numbers.formatInteger(order.netTotal, 1, 'POINT') + ' đ'}"></p>
            <p class="account-muted" th:if="${order.voucherCode != null}" th:text="${'Voucher ' + order.voucherCode + ' · giảm ' + #numbers.formatInteger(order.voucherDiscount,1,'POINT') + ' đ'}"></p>
          </div>
          <div class="account-record-actions">
            <span class="account-status" th:text="${order.statusLabel}"></span>
            <a class="account-text-action" th:href="@{/reservations/confirmation(code=${order.reservation.code})}">Xem món</a>
          </div>
        </li>
      </ul>
    </div>

    <div th:fragment="vouchers">
      <nav class="account-tabs" aria-label="Trạng thái voucher">
        <a th:href="@{/account/vouchers}" th:attr="aria-current=${tab == 'available' ? 'page' : null}">Đang có</a>
        <a th:href="@{/account/vouchers(tab='used')}" th:attr="aria-current=${tab == 'used' ? 'page' : null}">Đã sử dụng</a>
        <a th:href="@{/account/vouchers(tab='expired')}" th:attr="aria-current=${tab == 'expired' ? 'page' : null}">Hết hạn</a>
      </nav>
      <th:block th:if="${voucherOffers.empty and usedVouchers.empty}">
        <div th:replace="~{account/fragments/activity :: empty('vouchers',${tab == 'used' ? 'Chưa có voucher đã sử dụng' : (tab == 'expired' ? 'Chưa có voucher hết hạn' : 'Chưa có voucher khả dụng')},null)}"></div>
      </th:block>
      <ul class="account-list" th:unless="${voucherOffers.empty}">
        <li class="account-record" th:each="offer : ${voucherOffers}">
          <div>
            <p class="account-record-title" th:text="${offer.title + ' · Giảm ' + offer.offerLabel}"></p>
            <p class="account-muted" th:text="${'Mã ' + offer.code + ' · Hết hạn ' + #temporals.format(offer.endsAt,'dd/MM/yyyy HH:mm')}"></p>
            <p class="account-muted" th:text="${'Tiền món tối thiểu ' + #numbers.formatInteger(offer.minimumTotal,1,'POINT') + ' đ'}"></p>
            <p class="account-muted" th:if="${offer.maximumDiscount != null}" th:text="${'Giảm tối đa ' + #numbers.formatInteger(offer.maximumDiscount,1,'POINT') + ' đ'}"></p>
            <p class="account-muted" th:if="${offer.customerLimit != null}" th:text="${'Tối đa ' + offer.customerLimit + ' lượt mỗi khách'}"></p>
          </div>
          <div class="account-record-actions" th:if="${tab == 'available'}">
            <button type="button" class="account-button" th:attr="data-copy-voucher=${offer.code}">Sao chép mã</button>
          </div>
        </li>
      </ul>
      <ul class="account-list" th:unless="${usedVouchers.empty}">
        <li class="account-record" th:each="usage : ${usedVouchers}">
          <div><p class="account-record-title" th:text="${usage.code + ' · T3L-HD-' + usage.orderId}"></p>
          <p class="account-muted" th:text="${'Đã giảm ' + #numbers.formatInteger(usage.discountAmount,1,'POINT') + ' đ · ' + #temporals.format(usage.closedAt,'dd/MM/yyyy HH:mm')}"></p></div>
        </li>
      </ul>
    </div>
  </body>
</html>
