<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Xác thực số điện thoại | T3L Restaurant</title>
    <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css(v=2)}" />
    <link rel="stylesheet" th:href="@{/css/account.css}" />
    <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
    <script data-page-script defer th:src="@{/js/account.js}"></script>
  </head>
  <body class="home account-page">
    <a class="skip-link" href="#account-content">Chuyển đến nội dung</a>
    <header th:replace="~{web/fragments/restaurant-shell :: header('account')}"></header>
    <main data-navigation class="account-area" id="main" aria-labelledby="account-title">
      <div class="account-layout">
        <aside th:replace="~{account/fragments/sidebar :: customer('profile', 'Khách T3L')}"></aside>
        <div class="account-content" id="account-content" tabindex="-1">
          <header class="account-heading"><h1 id="account-title">Xác thực số điện thoại</h1></header>
          <section class="account-card account-stack account-verification" aria-labelledby="account-title">
            <th:block th:replace="${content}"></th:block>
          </section>
        </div>
      </div>
    </main>
    <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>
    <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
  </body>
</html>
