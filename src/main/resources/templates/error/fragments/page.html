<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code, heading, description)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${heading + ' | T3L Restaurant'}">T3L Restaurant</title>
    <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/confirmation.css}" />
    <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
  </head>
  <body class="home confirmation-page">
    <a class="skip-link" href="#main">Chuyển đến nội dung</a>
    <header th:replace="~{web/fragments/restaurant-shell :: header('error')}"></header>
    <main id="main" class="receipt-main">
      <section class="home-container receipt-unavailable" aria-labelledby="error-title">
        <p class="home-eyebrow" th:text="${'LỖI ' + code}">Lỗi</p>
        <h1 id="error-title" th:text="${heading}"></h1>
        <p th:text="${description}"></p>
        <div class="receipt-unavailable-actions">
          <a class="home-button" th:href="@{/}">Quay lại trang chủ</a>
          <a class="home-button home-button-outline" th:href="@{/reservations/lookup}">Tra cứu đặt bàn</a>
        </div>
      </section>
    </main>
    <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>
    <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
  </body>
</html>
