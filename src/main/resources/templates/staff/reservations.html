<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{${opsBase == '/admin' ? 'admin/fragments/shell' : 'staff/fragments/shell'} :: head('Quản lý đặt bàn')}"></head>
  <body class="staff-page" th:classappend="${opsBase == '/admin' ? 'admin-page' : ''}">
    <header th:replace="~{${opsBase == '/admin' ? 'admin/fragments/shell' : 'staff/fragments/shell'} :: header('reservations')}"></header>
    <main data-navigation data-navigation-fragment class="staff-main">
      <div class="staff-page-heading">
        <div><h1>Quản lý đặt bàn</h1><p>Tìm nhanh theo tên, số điện thoại hoặc mã đặt bàn; xử lý trực tiếp tại danh sách.</p></div>
        <a class="staff-button" th:href="@{${opsBase + '/reservations/new'}}">Tạo đặt bàn</a>
      </div>
      <div th:replace="~{staff/fragments/shell :: messages}"></div>
      <section class="staff-panel" aria-labelledby="reservation-list-title">
        <div class="staff-panel-heading"><h2 id="reservation-list-title">Danh sách đặt bàn</h2>
          <a class="staff-link" href="#request-queue-title" th:text="${'Yêu cầu thay đổi (' + #lists.size(changeRequests) + ')'}"></a>
        </div>
        <form class="staff-filters" th:action="@{${opsBase + '/reservations'}}" method="get">
          <label class="staff-field">Ngày đến <input type="date" name="date" th:value="${date}" /></label>
          <label class="staff-field">Trạng thái <select name="status"><option value="">Tất cả</option>
            <option th:each="option : ${statuses}" th:value="${option.key}" th:text="${option.value}" th:selected="${option.key == status}"></option>
          </select></label>
          <label class="staff-field staff-full">Tìm theo tên, số điện thoại hoặc mã đặt bàn <input name="q" th:value="${q}" maxlength="120" autocomplete="off" /></label>
          <div class="staff-actions"><button class="staff-button" type="submit">Lọc</button><a class="staff-link" th:href="@{${opsBase + '/reservations'}}">Bỏ lọc</a></div>
        </form>
        <p class="staff-result-count" th:text="${results.totalElements + ' lượt đặt bàn'}"></p>
        <p class="staff-empty" th:if="${results.empty}">Không có lượt đặt phù hợp.</p>
        <div class="staff-table-wrap" th:unless="${results.empty}">
          <table class="staff-table">
            <thead><tr><th scope="col">Đặt bàn</th><th scope="col">Khách</th><th scope="col">Lịch đến</th><th scope="col">Bàn</th><th scope="col">Trạng thái / cọc</th><th scope="col">Thao tác</th></tr></thead>
            <tbody><tr th:each="booking : ${results.content}"
                th:attr="data-payment-status-url=@{${opsBase + '/reservations/{id}/payment-status'}(id=${booking.id})}">
              <td data-label="Đặt bàn"><a class="staff-link staff-code" th:href="@{${opsBase + '/reservations/{id}'}(id=${booking.id})}" th:text="${booking.code}"></a></td>
              <td data-label="Khách"><strong th:text="${booking.guestName}"></strong><small th:unless="${#strings.isEmpty(booking.guestPhone)}" th:text="${booking.guestPhone}"></small></td>
              <td data-label="Lịch đến"><strong th:text="${#temporals.format(booking.startsAt, 'dd/MM/yyyy · HH:mm')}"></strong><small th:text="${booking.guestCount + ' khách'}"></small></td>
              <td data-label="Bàn" th:text="${booking.table == null ? 'Chưa phân bàn' : booking.table.code}"></td>
              <td data-label="Trạng thái / cọc"><span th:replace="~{staff/fragments/shell :: status(${booking})}"></span>
                <span class="staff-badge staff-deposit-state" th:if="${booking.depositAmount.signum() > 0}"
                    th:text="${booking.depositStatusLabel}" th:attr="data-status=${booking.depositStatus}"></span>
              </td>
              <td data-label="Thao tác" th:with="actions=${bookingActions.get(booking.id)}">
                <div class="staff-row-actions">
                  <a class="staff-link" th:href="@{${opsBase + '/reservations/{id}'}(id=${booking.id})}">Chi tiết</a>
                  <form th:if="${actions.confirm}" th:action="@{${opsBase + '/reservations/{id}/status'}(id=${booking.id})}" method="post" data-partial-submit>
                    <button class="staff-button" name="status" value="CONFIRMED" th:disabled="${!actions.confirmEnabled}"
                        th:title="${actions.confirmReason}">Xác nhận đặt bàn</button>
                    <small class="staff-action-reason" th:if="${!actions.confirmEnabled}" th:text="${actions.confirmReason}"></small>
                  </form>
                  <form th:if="${actions.receive}" th:action="@{${opsBase + '/reservations/{id}/status'}(id=${booking.id})}" method="post" data-partial-submit>
                    <button class="staff-button is-outline" name="status" value="SEATED" th:disabled="${!actions.receiveEnabled}"
                        th:title="${actions.receiveReason}">Nhận khách &amp; bàn</button>
                    <small class="staff-action-reason" th:if="${!actions.receiveEnabled}" th:text="${actions.receiveReason}"></small>
                  </form>
                </div>
              </td>
            </tr></tbody>
          </table>
        </div>
        <nav class="staff-pagination" aria-label="Phân trang đặt bàn" th:if="${results.totalPages > 1}">
          <a class="staff-link" th:if="${results.hasPrevious()}" th:href="@{${opsBase + '/reservations'}(date=${date},status=${status},q=${q},page=${results.number - 1})}">Trang trước</a>
          <span th:text="${'Trang ' + (results.number + 1) + ' / ' + results.totalPages}"></span>
          <a class="staff-link" th:if="${results.hasNext()}" th:href="@{${opsBase + '/reservations'}(date=${date},status=${status},q=${q},page=${results.number + 1})}">Trang sau</a>
        </nav>
      </section>
      <section th:replace="~{staff/fragments/reservation-requests :: queue}"></section>
    </main>
    <script data-page-script th:src="@{/js/staff-payment-status.js}" defer></script>
  </body>
</html>
