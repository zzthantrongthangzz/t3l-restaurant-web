<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{${opsBase == '/admin' ? 'admin/fragments/shell' : 'staff/fragments/shell'} :: head('Quản lý đặt bàn')}"></head>
  <body class="staff-page table-plan-page-staff" th:classappend="${opsBase == '/admin' ? 'admin-page' : ''}">
    <header th:replace="~{${opsBase == '/admin' ? 'admin/fragments/shell' : 'staff/fragments/shell'} :: header('tables')}"></header>
    <main class="staff-main">
      <div class="staff-page-heading"><div><h1>Quản lý đặt bàn</h1><p>Sơ đồ bàn, thông tin khách và thao tác vận hành theo ngày đã chọn.</p></div>
        <a class="staff-button" th:href="@{${opsBase + '/reservations/new'}(walkIn=true)}">Đặt bàn ngay</a></div>
      <div th:replace="~{staff/fragments/shell :: messages}"></div>
      <form class="table-plan-toolbar" method="get" th:action="@{${opsBase + '/tables'}}">
        <label class="staff-field">Ngày xem<input type="date" name="date" th:value="${selectedDate}" /></label>
        <button class="staff-button" type="submit">Lọc sơ đồ</button>
        <a class="staff-button is-outline" th:href="@{${opsBase + '/reservations/new'}}">Đặt bàn chờ</a>
        <a class="staff-button is-outline" th:href="@{${opsBase + '/reservations'}(date=${selectedDate},status='PENDING_CONFIRMATION')}">Nhận / duyệt bàn chờ</a>
        <a class="staff-button is-outline" th:href="@{${opsBase + '/reservations'}(date=${selectedDate},status='CONFIRMED')}">Huỷ bàn chờ</a>
      </form>
      <ul class="table-plan-legend table-plan-staff-legend" aria-label="Trạng thái bàn">
        <li><span class="plan-dot is-free"></span>Bàn trống</li><li><span class="plan-dot is-pending"></span>Chờ xác nhận</li>
        <li><span class="plan-dot is-booked"></span>Đã đặt / khách đã đến</li><li><span class="plan-dot is-serving"></span>Đang phục vụ</li>
      </ul>
      <p class="staff-empty" th:if="${areas.isEmpty()}">Chưa có bàn trong hệ thống.</p>
      <section class="staff-table-plan-group" th:each="group : ${areas}">
        <h2 th:text="${group.key}"></h2>
        <div class="table-plan-grid">
          <article class="plan-table-card" th:each="item : ${group.value}" th:with="table=${item.table},booking=${item.current},tableImage=${item.state == 'FREE' ? (item.table.tableType.toLowerCase().contains('vip') ? 'banXam_vip.png' : 'banXam_thuong.png') : (item.state == 'OCCUPIED' ? (item.table.tableType.toLowerCase().contains('vip') ? 'banDo_vip.png' : 'banDo_thuong.png') : (item.table.tableType.toLowerCase().contains('vip') ? 'banVang_vip.png' : 'banVang_thuong.png'))}"
              th:classappend="${item.state == 'FREE' ? ' is-free' : (item.state == 'PENDING' ? ' is-pending' : (item.state == 'OCCUPIED' ? ' is-serving' : ' is-booked'))}">
            <a class="plan-table-hit" th:if="${booking != null}" th:href="@{${opsBase + '/reservations/{id}'}(id=${booking.id})}" th:aria-label="${'Chi tiết ' + table.code}"></a>
            <a class="plan-table-hit" th:if="${booking == null and table.active}" th:href="@{${opsBase + '/reservations/new'}(tableId=${table.id},date=${selectedDate})}" th:aria-label="${'Đặt ' + table.code}"></a>
            <img class="plan-table-image" th:src="@{/images/tables/{image}(image=${tableImage})}" alt="" width="120" height="84" />
            <h3 th:text="${table.code}"></h3><p class="plan-table-meta" th:text="${table.capacity + ' chỗ · ' + table.tableType}"></p>
            <span class="plan-table-state" th:text="${!table.active ? 'Tạm ngưng' : (item.state == 'FREE' ? 'Bàn trống' : (item.state == 'PENDING' ? 'Chờ nhân viên xác nhận' : (item.state == 'OCCUPIED' ? 'Đang phục vụ' : 'Đã xác nhận đặt')))}"></span>
            <div class="plan-table-customer" th:if="${booking != null}">
              <strong th:text="${booking.guestName}"></strong><span th:text="${booking.guestPhone}"></span>
              <span th:text="${#temporals.format(booking.startsAt,'dd/MM HH:mm') + ' · ' + booking.guestCount + ' khách · ' + booking.statusLabel + (booking.depositAmount.signum() > 0 ? ' · Cọc: ' + booking.depositStatusLabel : '')}"></span>
            </div>
            <div class="plan-table-actions" th:if="${booking != null}">
              <a class="staff-button is-outline" th:href="@{${opsBase + '/reservations/{id}'}(id=${booking.id})}">Chi tiết / chuyển bàn</a>
              <a class="staff-button is-outline" th:if="${item.state == 'OCCUPIED'}" th:href="@{${opsBase + '/orders/{id}'}(id=${booking.id})}">Đặt món / tính tiền</a>
              <form th:if="${booking.status == 'CHECKED_IN'}" th:action="@{${opsBase + '/reservations/{id}/status'}(id=${booking.id})}" method="post">
                <input type="hidden" name="from" value="table" /><input type="hidden" name="returnDate" th:value="${selectedDate}" /><button class="staff-button" name="status" value="SEATED">Nhận bàn</button>
              </form>
            </div>
            <form class="plan-table-actions" th:if="${!table.active or item.state == 'FREE'}"
                  th:action="@{${opsBase + '/tables/{id}/availability'}(id=${table.id})}" method="post">
              <input type="hidden" name="returnDate" th:value="${selectedDate}" />
              <button class="staff-button is-outline" type="submit" name="active" th:value="${!table.active}"
                      th:text="${table.active ? 'Tạm ngưng bàn' : 'Mở lại bàn'}"></button>
            </form>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
