<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="heading(title, description)" class="sign-in-heading">
      <p class="sign-in-brand">
        <span class="sign-in-brand-mark">T3L.</span>
        <span class="sign-in-brand-name">Restaurant</span>
      </p>
      <h1 id="auth-title" th:text="${title}"></h1>
      <p th:text="${description}"></p>
    </header>
    <svg th:fragment="fieldIcon(field)" class="sign-in-field-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <th:block th:switch="${field}">
        <path th:case="'phone'" d="M7.5 3.5h2l1.5 4-2.5 2a12 12 0 0 0 6 6l2-2.5 4 1.5v2a3 3 0 0 1-3.3 3C10.3 18.7 5.3 13.7 4.5 6.8a3 3 0 0 1 3-3.3Z" />
        <th:block th:case="'password'">
          <rect x="5" y="10" width="14" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v2" />
        </th:block>
        <th:block th:case="'name'">
          <circle cx="12" cy="7" r="3.5" />
          <path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2" />
        </th:block>
        <th:block th:case="'code'">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <path d="m3.5 7 8.5 6 8.5-6" />
        </th:block>
      </th:block>
    </svg>
    <button th:fragment="passwordToggle(fieldId, label)" class="login-password-toggle" type="button"
            th:attr="data-password-toggle=${fieldId},data-password-label=${label},aria-label=|Hiện ${label}|"
            aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
        <path class="login-eye-slash" d="m3 3 18 18" />
      </svg>
    </button>
    <script th:fragment="passwords">
      (() => {
        document.querySelectorAll('[data-password-toggle]').forEach((toggle) => {
          const password = document.getElementById(toggle.dataset.passwordToggle);
          const label = toggle.dataset.passwordLabel || 'mật khẩu';
          toggle.hidden = false;
          toggle.addEventListener('click', () => {
            const visible = password.type === 'password';
            password.type = visible ? 'text' : 'password';
            toggle.setAttribute('aria-pressed', String(visible));
            toggle.setAttribute('aria-label', (visible ? 'Ẩn ' : 'Hiện ') + label);
          });
        });
      })();
    </script>
  </body>
</html>
