<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content, pageClass)"
      th:with="signIn=${!#strings.isEmpty(pageClass)}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${title + ' | T3L Restaurant'}">T3L Restaurant</title>
    <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css(v=5)}" />
    <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
  </head>
  <body class="home login-page" th:classappend="${pageClass}">
    <a class="skip-link" href="#main">Chuyển đến nội dung</a>
    <header th:replace="~{web/fragments/restaurant-shell :: header('login')}"></header>
    <main id="main" class="login-scene" th:classappend="${signIn} ? 'sign-in-scene'">
      <img class="login-background" th:src="@{/images/home/dining-room.jpg}" alt="" width="1800" height="1200" fetchpriority="high" />
      <div class="login-shade" aria-hidden="true"></div>
      <div class="home-container auth-center">
        <section class="login-panel auth-card" th:classappend="${signIn} ? 'sign-in-card'" aria-labelledby="auth-title">
          <div class="login-panel-heading" th:unless="${signIn}"><h1 id="auth-title" th:text="${title}"></h1></div>
          <th:block th:replace="${content}"></th:block>
        </section>
      </div>
    </main>
    <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>
    <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
    <th:block th:if="${signIn}">
      <script th:replace="~{auth/fragments/account-controls :: passwords}"></script>
    </th:block>
  </body>
</html>
