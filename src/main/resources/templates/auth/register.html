<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{auth/fragments/customer-shell :: page('Tạo tài khoản', ~{::content})}">
  <body>
    <th:block th:fragment="content">
      <p class="auth-help">Tạo tài khoản bằng số điện thoại và mật khẩu. Sau khi đăng ký, bạn có thể đăng nhập ngay.</p>
      <p class="login-notice login-notice-error" role="alert"
          th:if="${registrationError != null}" th:text="${registrationError}"></p>
      <form class="login-form register-form" method="post" th:action="@{/register}"
          th:object="${registrationForm}">
        <input type="hidden" name="returnTo" th:if="${registrationReturnTo != null}" th:value="${registrationReturnTo}" />
        <div class="login-field register-wide">
          <label for="fullName">Họ và tên <span aria-hidden="true">*</span></label>
          <input id="fullName" th:field="*{fullName}" autocomplete="name" maxlength="120"
              placeholder="Nguyễn Văn An" required th:attr="aria-invalid=${#fields.hasErrors('fullName')}" />
          <small class="register-error" th:errors="*{fullName}"></small>
        </div>
        <div class="login-field register-wide">
          <label for="phone">Số điện thoại <span aria-hidden="true">*</span></label>
          <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" maxlength="30"
              placeholder="090 123 4567" required th:attr="aria-invalid=${#fields.hasErrors('phone')}" />
          <small class="register-error" th:errors="*{phone}"></small>
        </div>
        <div class="login-field register-wide">
          <label for="register-password">Mật khẩu</label>
          <input id="register-password"
                 name="password"
                 type="password"
                 autocomplete="new-password"
                 minlength="12"
                 maxlength="72"
                 required />
          <small class="register-error" th:errors="*{password}"></small>
        </div>

        <div class="login-field register-wide">
          <label for="register-confirm-password">Xác nhận mật khẩu</label>
          <input id="register-confirm-password"
                 name="confirmPassword"
                 type="password"
                 autocomplete="new-password"
                 required />
          <small class="register-error" th:errors="*{confirmPassword}"></small>
        </div>
        <button class="home-button login-submit register-wide" type="submit">Tạo tài khoản</button>
      </form>
      <a class="login-home-link" th:href="@{/login(returnTo=${registrationReturnTo})}">Đã có tài khoản? Đăng nhập</a>
    </th:block>
  </body>
</html>
