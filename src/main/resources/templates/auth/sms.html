<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{auth/fragments/customer-shell :: page(${linkingSms ? 'Xác thực số điện thoại' : 'Đăng nhập bằng SMS'}, ~{::content})}">
  <body>
    <th:block th:fragment="content">
      <p class="auth-help">Nhập số di động Việt Nam để nhận mã xác thực 6 chữ số.</p>
      <p class="login-notice login-notice-error" th:if="${smsError != null}" th:text="${smsError}" role="alert"></p>
      <p class="login-notice login-notice-success" th:if="${requestAccepted}" role="status">Yêu cầu đã được eSMS tiếp nhận. Mã có hiệu lực trong 5 phút.</p>
      <div class="login-notice" th:if="${localCode != null}" role="status">
        <p>Chế độ kiểm thử cục bộ. Chưa gửi SMS.</p><strong th:text="${'Mã kiểm thử: ' + localCode}"></strong>
      </div>
      <p class="login-notice" th:unless="${smsAvailable}">Phương thức SMS hiện chưa khả dụng.</p>
      <form class="login-form" method="post" th:if="${pendingPhone != null}"
          th:action="${linkingSms} ? @{/account/sms/verify} : @{/login/sms/verify}">
        <input type="hidden" name="returnTo" th:value="${smsReturnTo}" />
        <div class="login-field">
          <label for="code" th:text="${'Mã xác thực cho ' + pendingPhone}"></label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus />
        </div>
        <button class="home-button login-submit" type="submit">Xác nhận mã</button>
      </form>
      <form class="login-form" method="post" th:if="${smsAvailable}"
          th:action="${linkingSms} ? @{/account/sms/send} : @{/login/sms/send}">
        <input type="hidden" name="returnTo" th:value="${smsReturnTo}" />
        <div class="login-field">
          <label for="sms-phone">Số điện thoại</label>
          <input id="sms-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="090 123 4567" th:value="${pendingPhone}" required />
        </div>
        <button th:class="${pendingPhone == null} ? 'home-button login-submit' : 'login-google auth-option'"
            th:text="${pendingPhone == null ? 'Yêu cầu mã SMS' : 'Yêu cầu mã mới'}" type="submit"></button>
        <small class="auth-help" th:if="${pendingPhone != null}">Bạn có thể yêu cầu mã mới sau ít nhất 60 giây.</small>
      </form>
      <a class="login-home-link" th:if="${linkingSms}" th:href="@{/account}">Quay về tài khoản</a>
      <a class="login-home-link" th:unless="${linkingSms}" th:href="@{/login(returnTo=${smsReturnTo})}">Chọn phương thức đăng nhập</a>
    </th:block>
  </body>
</html>
