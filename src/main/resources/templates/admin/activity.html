<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/shell :: head('Nhật ký thao tác')}"></head>
<body class="staff-page admin-page"><header th:replace="~{admin/fragments/shell :: header('activity')}"></header>
<main data-navigation data-navigation-fragment class="staff-main">
  <div class="staff-page-heading"><div><h1>Nhật ký thao tác</h1><p>Lịch sử thao tác của nhân viên và quản trị viên, kèm đối tượng được cập nhật.</p></div></div>
  <section class="staff-panel">
    <form th:replace="~{admin/fragments/report :: filters('/admin/activity','activity')}"></form>
    <p class="staff-empty" th:if="${rows.content.isEmpty()}">Chưa có thao tác trong khoảng thời gian này.</p>
    <div class="staff-table-wrap" th:unless="${rows.content.isEmpty()}"><table class="staff-table"><thead><tr>
      <th>Thời gian</th><th>Vai trò</th><th>Người thao tác</th><th>Thao tác</th><th>Đối tượng</th><th>Chi tiết</th>
    </tr></thead><tbody>
      <tr th:each="row : ${rows.content}">
        <td data-label="Thời gian" th:text="${#temporals.format(row.time,'dd/MM/yyyy HH:mm:ss')}"></td>
        <td data-label="Vai trò" th:text="${row.actorRole == 'STAFF' ? 'Nhân viên' : 'Quản trị viên'}"></td>
        <td data-label="Người thao tác" th:text="${row.actor}"></td>
        <td data-label="Thao tác" th:text="${row.operation}"></td>
        <td data-label="Đối tượng" th:text="${row.targetLabel}"></td>
        <td data-label="Chi tiết" th:text="${row.details == null or #strings.isEmpty(row.details) ? '—' : row.details}"></td>
      </tr></tbody></table></div>
    <nav th:replace="~{admin/fragments/report :: pages('/admin/activity')}"></nav>
  </section>
</main></body></html>
