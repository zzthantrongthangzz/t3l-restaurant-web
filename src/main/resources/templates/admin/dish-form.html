<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/shell :: head(${heading})}"></head>
<body class="staff-page admin-page">
<header th:replace="~{admin/fragments/shell :: header('dishes')}"></header>
<main class="staff-main dish-editor">
  <div class="staff-page-heading">
    <a class="staff-link staff-back" th:href="@{/menu}">← Về thực đơn</a>
    <h1 th:text="${heading}"></h1>
  </div>
  <form id="dish-editor" class="dish-editor-grid" th:object="${form}"
        th:action="${dishId == null} ? @{/admin/dishes} : @{/admin/dishes/{id}(id=${dishId})}"
        method="post" enctype="multipart/form-data">
    <div class="staff-panel dish-editor-fields">
      <div th:replace="~{admin/fragments/shell :: errors}"></div>
      <h2>Thông tin món</h2>
      <div class="staff-form-grid">
        <label class="staff-field">Tên món<input th:field="*{name}" required maxlength="140" /></label>
        <label class="staff-field">Giá (₫)<input th:field="*{price}" type="number" min="1" max="999999999999" step="1" required /></label>
        <label class="staff-field">Danh mục
          <select th:field="*{categoryName}" required>
            <option value="">Chọn danh mục</option>
            <option th:each="item : ${categories}" th:value="${item.name}" th:text="${item.name + (item.active ? '' : ' (đang ẩn)')}"></option>
          </select>
        </label>
        <label class="staff-field">Ghi chú chế độ ăn<input th:field="*{dietaryLabel}" maxlength="80" /></label>
        <label class="staff-field staff-full">Mô tả<textarea th:field="*{description}" rows="5" maxlength="1000" required></textarea></label>
      </div>
      <label class="staff-checkbox"><input type="checkbox" th:field="*{available}" /> Món còn bán</label>
      <label class="staff-checkbox"><input type="checkbox" th:field="*{published}" /> Hiển thị trên thực đơn</label>
    </div>

    <div class="staff-panel dish-editor-media">
      <h2>Ảnh món</h2>
      <img id="dish-editor-preview" th:src="${#strings.isEmpty(currentImageUrl)} ? @{/images/menu/dish-placeholder.svg} : ${currentImageUrl}"
           alt="Xem trước ảnh món" width="540" height="375" referrerpolicy="no-referrer" />
      <label class="staff-field">Tải ảnh lên Cloudinary
        <input type="file" id="dish-editor-image" name="image" accept="image/jpeg,image/png,image/webp" />
        <small>JPEG, PNG hoặc WebP, tối đa 5 MB.</small>
      </label>
      <label class="staff-field">URL ảnh hiện tại
        <input th:field="*{imageUrl}" maxlength="500" placeholder="https://" />
        <small>Xóa URL và lưu để gỡ ảnh hiện tại.</small>
      </label>
      <button type="submit" class="staff-button">Lưu món</button>
      <a class="staff-button is-outline" th:href="@{/menu}">Hủy</a>
    </div>
  </form>
  <form class="staff-actions admin-danger-action" th:if="${dishId != null}" th:action="@{/admin/dishes/{id}/delete(id=${dishId})}" method="post">
    <button type="submit" class="staff-button is-danger" data-confirm="Xóa món khỏi thực đơn? Món đã có giao dịch sẽ được giữ lại.">Xóa món</button>
  </form>
</main>
</body>
</html>
