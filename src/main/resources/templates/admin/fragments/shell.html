<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title th:text="${title + ' | T3L Restaurant'}">T3L Restaurant</title>
  <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
  <link rel="stylesheet" th:href="@{/css/site.css}" />
  <link rel="stylesheet" th:href="@{/css/reservation-requests.css}" />
  <link rel="stylesheet" th:href="@{/css/staff.css(v=4)}" />
  <link rel="stylesheet" th:href="@{/css/table-plan.css(v=table-commands)}" />
  <link rel="stylesheet" th:href="@{/css/admin.css(v=analytics-sans)}" />
  <script data-page-script defer th:src="@{/js/staff.js}"></script>
  <script data-page-script defer th:src="@{/js/staff-pending-bookings.js}"></script>
  <script data-page-script defer th:src="@{/js/admin.js}"></script>
  <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
</head>
<body>
<header class="admin-sidebar" th:fragment="header(section)" data-nav-shell="admin">
  <div class="admin-brand-row">
    <a class="staff-brand" th:href="@{/admin/dashboard}">
      <span class="staff-brand-mark">T3L<span>.</span></span>
      <span>T3L Restaurant<small>Quản trị nhà hàng</small></span>
    </a>
    <div class="admin-brand-controls">
      <button type="button" class="staff-signout admin-toggle" aria-expanded="false" aria-controls="admin-navigation" hidden>Menu</button>
    </div>
  </div>
  <div class="admin-navigation" id="admin-navigation">
    <nav aria-label="Điều hướng quản trị">
      <a th:replace="~{:: navItem(${section}, 'dashboard', '/admin/dashboard', 'Tổng quan', 'dashboard')}"></a>
      <section class="admin-nav-group" aria-labelledby="admin-nav-operations">
      <h2 id="admin-nav-operations" class="admin-nav-label">Vận hành</h2>
      <a th:replace="~{:: navItem(${section}, 'tables', '/admin/tables', 'Sơ đồ bàn', 'tables')}"></a>
      <a th:replace="~{:: navItem(${section}, 'reservations', '/admin/reservations', 'Danh sách &amp; duyệt đặt bàn', 'calendar')}"></a>
      <a th:replace="~{:: navItem(${section}, 'orders', '/admin/orders', 'Đơn đang phục vụ', 'dining')}"></a>
      <a th:replace="~{:: navItem(${section}, 'invoices', '/admin/invoices', 'Hóa đơn', 'receipt')}"></a>
      <a th:replace="~{:: navItem(${section}, 'revenue', '/admin/revenue', 'Doanh thu', 'chart')}"></a>
      <a th:replace="~{:: navItem(${section}, 'analytics', '/admin/analytics', 'Phân tích hành vi', 'analytics')}"></a>
      <a th:replace="~{:: navItem(${section}, 'shift', '/admin/shifts', 'Ca làm &amp; đối soát', 'clock')}"></a>
      </section>
      <section class="admin-nav-group" aria-labelledby="admin-nav-management">
      <h2 id="admin-nav-management" class="admin-nav-label">Quản lý</h2>
      <a th:replace="~{:: navItem(${section}, 'vouchers', '/admin/vouchers', 'Voucher &amp; khuyến mãi', 'ticket')}"></a>
      <a th:replace="~{:: navItem(${section}, 'accounts', '/admin/accounts', 'Tài khoản', 'person')}"></a>
      <a th:replace="~{:: navItem(${section}, 'inventory', '/admin/inventory', 'Danh mục bàn', 'inventory')}"></a>
      <a th:replace="~{:: navItem(${section}, 'dishes', '/menu', 'Thực đơn', 'menu')}"></a>
      <a th:replace="~{:: navItem(${section}, 'contacts', '/admin/contacts', 'Liên hệ', 'mail')}"></a>
      <a th:replace="~{:: navItem(${section}, 'faqs', '/admin/faqs', 'Quản lý FAQ', 'help')}"></a>
      <a th:replace="~{:: navItem(${section}, 'settings', '/admin/settings', 'Cấu hình', 'settings')}"></a>
      <a th:replace="~{:: navItem(${section}, 'activity', '/admin/activity', 'Nhật ký thao tác', 'history')}"></a>
      </section>
    </nav>
  </div>
  <div class="admin-nav-actions">
    <a th:href="@{/}"><svg th:replace="~{staff/fragments/shell :: icon('home')}"></svg><span>Trang khách hàng</span></a>
    <div class="admin-account-controls">
      <div th:replace="~{account/fragments/sidebar :: employee}"></div>
      <button th:replace="~{web/fragments/theme :: toggle}"></button>
    </div>
  </div>
  <a class="staff-pending-float" data-pending-bookings hidden
      th:href="@{/admin/reservations(status='PENDING_CONFIRMATION')}"
      th:attr="data-endpoint=@{/admin/notifications/pending-bookings}"
      aria-live="polite" aria-label="Mở các yêu cầu đặt bàn đang chờ">
    <span>Hiện có</span><strong data-pending-count>0</strong><span>yêu cầu đặt bàn đang chờ</span>
  </a>
</header>
<a th:fragment="navItem(section, key, path, label, icon)" class="admin-nav-link" th:href="@{${path}}"
   th:attr="aria-current=${section == key ? 'page' : null}">
  <svg th:replace="~{staff/fragments/shell :: icon(${icon})}"></svg><span th:text="${label}"></span>
</a>
<div th:fragment="messages" th:remove="tag">
  <div th:replace="~{staff/fragments/shell :: messages}"></div>
</div>
<div th:fragment="errors" th:if="${#fields.hasAnyErrors()}" class="staff-notice is-error" role="alert">
  <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
</div>
<span th:fragment="money(value)" th:text="${value == null ? '—' : #numbers.formatInteger(value,1,'POINT') + ' đ'}"></span>
<span th:fragment="method(value)" th:text="${value == 'CASH' ? 'Tiền mặt' : (value == 'TRANSFER' ? 'Chuyển khoản' : (value == 'CARD' ? 'Thẻ' : (value == 'DEPOSIT' ? 'Tiền cọc' : '—')))}"></span>
</body></html>
