<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/shell :: head('Chi tiết hóa đơn')}"></head>
<body class="staff-page admin-page"><header th:replace="~{admin/fragments/shell :: header('invoices')}"></header>
<main class="staff-main" th:with="order=${view.order},payment=${view.payment},booking=${view.booking}">
  <a class="staff-link staff-back" th:href="@{/admin/invoices}">Danh sách hóa đơn</a>
  <div class="staff-page-heading">
    <div><h1 th:text="${order.invoiceNumber}"></h1><p><a class="staff-link" th:href="@{/admin/reservations/{id}(id=${booking.id})}" th:text="${booking.code}"></a>
      <span th:text="${' · ' + booking.guestName}"></span></p></div>
    <span class="staff-badge" th:attr="data-status=${order.status}" th:text="${order.statusLabel}"></span>
  </div>
  <div class="staff-stack">
    <section class="staff-panel">
      <div class="staff-panel-heading"><h2>Chi tiết món</h2><strong class="staff-total">
        <span th:replace="~{admin/fragments/shell :: money(${order.totalAmount ?: order.currentTotal})}"></span></strong></div>
      <div class="staff-table-wrap" th:unless="${order.items.isEmpty()}"><table class="staff-table"><thead><tr><th>Món</th><th>Số lượng</th><th>Đơn giá tại thời điểm gọi</th><th>Thành tiền</th></tr></thead>
        <tbody><tr th:each="item : ${order.items}" th:classappend="${item.cancelled ? 'staff-cancelled' : ''}">
          <td data-label="Món"><strong th:text="${item.dishName}"></strong><small th:if="${item.cancelled}">Đã hủy</small></td>
          <td data-label="Số lượng" th:text="${item.quantity}"></td>
          <td data-label="Đơn giá"><span th:replace="~{admin/fragments/shell :: money(${item.unitPrice})}"></span></td>
          <td data-label="Thành tiền"><span th:replace="~{admin/fragments/shell :: money(${item.cancelled ? null : item.amount})}"></span></td>
        </tr></tbody></table></div>
      <p class="staff-empty" th:if="${order.items.isEmpty()}">Đơn chưa có món.</p>
    </section>
    <section class="staff-panel" th:if="${payment != null}">
      <h2>Giao dịch đã ghi nhận</h2>
      <dl th:replace="~{staff/fragments/settlement :: totals(${view})}"></dl>
      <dl class="staff-details staff-details-wide"><div><dt>Đã thu thêm</dt><dd><span th:replace="~{admin/fragments/shell :: money(${payment.amount})}"></span></dd></div>
        <div><dt>Phương thức</dt><dd th:text="${payment.methodLabel}"></dd></div>
        <div><dt>Nhân viên xác nhận</dt><dd th:text="${payment.receivedBy}"></dd></div>
        <div><dt>Thời gian thu</dt><dd th:text="${#temporals.format(payment.paidAt,'dd/MM/yyyy HH:mm')}"></dd></div>
        <div th:if="${payment.transferReference}"><dt>Mã giao dịch</dt><dd th:text="${payment.transferReference}"></dd></div>
      </dl>
    </section>
    <div class="staff-actions" th:if="${payment == null and booking.status == 'SEATED'}">
      <a class="staff-button is-outline" th:href="@{/admin/orders/{id}(id=${booking.id})}">Mở màn hình phục vụ</a>
    </div>
  </div>
</main></body></html>
