<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{admin/contact-detail :: contactHead('Quản lý liên hệ')}"></head>
  <body>
    <header th:replace="~{admin/contact-detail :: contactHeader}"></header>
    <main class="page inner-page admin-contacts">
      <span class="eyebrow">CHĂM SÓC KHÁCH HÀNG</span>
      <div class="section-heading"><div><h1>Liên hệ của khách hàng</h1><p class="lead">Tiếp nhận lời nhắn và theo dõi quá trình xử lý.</p></div><span th:text="${contacts.totalElements + ' liên hệ'}"></span></div>
      <form class="contact-admin-filter" th:action="@{/admin/contacts}" method="get">
        <label for="contact-status-filter">Trạng thái</label><select id="contact-status-filter" name="status"><option value="" th:selected="${filterStatus == ''}">Tất cả</option><option value="NEW" th:selected="${filterStatus == 'NEW'}">Mới tiếp nhận</option><option value="IN_PROGRESS" th:selected="${filterStatus == 'IN_PROGRESS'}">Đang xử lý</option><option value="RESOLVED" th:selected="${filterStatus == 'RESOLVED'}">Đã xử lý</option></select><button class="button" type="submit">Lọc liên hệ</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Ngày gửi</th><th>Khách hàng</th><th>Chủ đề</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
        <tr th:each="contact : ${contacts.content}"><td th:text="${#temporals.format(contact.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td><b th:text="${contact.name}"></b><small class="table-sub" th:text="${contact.email}"></small></td><td th:text="${contact.subject}"></td><td><span class="status" th:text="${contact.statusLabel}"></span></td><td><a class="text-link" th:href="@{/admin/contacts/{id}(id=${contact.id})}">Xem &amp; xử lý</a></td></tr>
        <tr th:if="${contacts.empty}"><td colspan="5" class="empty-cell">Không có liên hệ trong danh sách này.</td></tr>
      </tbody></table></div>
      <nav class="contact-admin-pages" aria-label="Phân trang liên hệ"><a class="text-link" th:if="${contacts.hasPrevious()}" th:href="@{/admin/contacts(status=${filterStatus},page=${contacts.number - 1})}">← Trang trước</a><span th:text="${'Trang ' + (contacts.number + 1) + ' / ' + (contacts.totalPages > 0 ? contacts.totalPages : 1)}"></span><a class="text-link" th:if="${contacts.hasNext()}" th:href="@{/admin/contacts(status=${filterStatus},page=${contacts.number + 1})}">Trang sau →</a></nav>
    </main>
  </body>
</html>
