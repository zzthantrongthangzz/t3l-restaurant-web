<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/shell :: head('Thực đơn')}"></head>
<body class="staff-page admin-page"><header th:replace="~{admin/fragments/shell :: header('dishes')}"></header>
<main class="staff-main">
  <div class="staff-page-heading"><div><h1>Thực đơn</h1><p>Quản lý giá, hình ảnh, trạng thái bán và hiển thị của món.</p></div>
    <div class="staff-actions"><a class="staff-button is-outline" th:href="@{/admin/categories}">Danh mục</a>
      <a class="staff-button" th:href="@{/admin/dishes/new}">Thêm món</a></div></div>
  <div th:replace="~{admin/fragments/shell :: messages}"></div>
  <section class="staff-panel">
    <form class="staff-filters" th:action="@{/admin/dishes}" method="get">
      <label class="staff-field">Tìm món<input name="q" th:value="${q}" maxlength="140" /></label>
      <label class="staff-field">Danh mục<select name="category"><option value="">Tất cả</option>
        <option th:each="item : ${categories}" th:value="${item.name}" th:text="${item.name}" th:selected="${item.name == category}"></option>
      </select></label>
      <label class="staff-field">Trạng thái bán<select name="stock"><option value="">Tất cả</option>
        <option value="available" th:selected="${stock == 'available'}">Còn bán</option><option value="sold-out" th:selected="${stock == 'sold-out'}">Hết món</option>
      </select></label>
      <label class="staff-field">Hiển thị<select name="visibility"><option value="">Tất cả</option>
        <option value="published" th:selected="${visibility == 'published'}">Đang hiển thị</option><option value="hidden" th:selected="${visibility == 'hidden'}">Đang ẩn</option>
      </select></label>
      <label class="staff-field">Sắp xếp<select name="sort"><option value="">Theo danh mục</option>
        <option value="name" th:selected="${sort == 'name'}">Theo tên</option><option value="price-asc" th:selected="${sort == 'price-asc'}">Giá tăng dần</option>
        <option value="price-desc" th:selected="${sort == 'price-desc'}">Giá giảm dần</option>
      </select></label>
      <div class="staff-actions"><button class="staff-button">Lọc</button><a class="staff-link" th:href="@{/admin/dishes}">Bỏ lọc</a></div>
    </form>
    <p class="staff-muted" th:text="${rows.totalElements + ' món'}"></p>
    <p class="staff-empty" th:if="${rows.empty}">Không có món phù hợp.</p>
    <div class="staff-table-wrap" th:unless="${rows.empty}"><table class="staff-table"><thead><tr><th>Món</th><th>Danh mục</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
      <tbody><tr th:each="dish : ${rows.content}">
        <td data-label="Món"><div class="admin-dish">
          <img class="admin-thumb" th:if="${!#strings.isEmpty(dish.imageUrl)}" th:src="${dish.imageUrl}" alt="" width="58" height="50" loading="lazy" referrerpolicy="no-referrer" />
          <div><a class="staff-link" th:href="@{/admin/dishes/{id}/edit(id=${dish.id})}" th:text="${dish.name}"></a>
            <small th:text="${dish.description}"></small></div></div></td>
        <td data-label="Danh mục"><span th:text="${dish.categoryName}"></span><small th:if="${hiddenCategories.contains(dish.categoryName)}">Danh mục đang ẩn</small></td>
        <td data-label="Giá"><span th:replace="~{admin/fragments/shell :: money(${dish.price})}"></span></td>
        <td data-label="Trạng thái"><div class="admin-badges">
          <span class="staff-badge" th:attr="data-status=${dish.available ? 'OPEN' : 'INACTIVE'}" th:text="${dish.available ? 'Còn bán' : 'Hết món'}"></span>
          <span class="staff-badge" th:text="${dish.published ? 'Cho phép hiển thị' : 'Đang ẩn'}"></span></div></td>
        <td data-label="Thao tác"><div class="staff-actions">
          <form th:action="@{/admin/dishes/{id}/state(id=${dish.id})}" method="post">
            <input type="hidden" name="stock" value="true" /><button class="staff-link staff-link-button" name="value" th:value="${!dish.available}" th:text="${dish.available ? 'Đánh dấu hết món' : 'Mở bán'}"></button></form>
          <form th:action="@{/admin/dishes/{id}/state(id=${dish.id})}" method="post">
            <button class="staff-link staff-link-button" name="value" th:value="${!dish.published}" th:text="${dish.published ? 'Ẩn món' : 'Hiện món'}"></button></form>
        </div></td>
      </tr></tbody></table></div>
    <nav class="staff-pagination" th:if="${rows.totalPages > 1}" aria-label="Phân trang thực đơn">
      <a class="staff-link" th:if="${rows.hasPrevious()}" th:href="@{/admin/dishes(q=${q},category=${category},stock=${stock},visibility=${visibility},sort=${sort},page=${rows.number - 1})}">Trang trước</a>
      <span th:text="${'Trang ' + (rows.number + 1) + ' / ' + rows.totalPages}"></span>
      <a class="staff-link" th:if="${rows.hasNext()}" th:href="@{/admin/dishes(q=${q},category=${category},stock=${stock},visibility=${visibility},sort=${sort},page=${rows.number + 1})}">Trang sau</a>
    </nav>
  </section>
</main></body></html>
