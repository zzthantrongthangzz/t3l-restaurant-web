<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="${title} + ' | T3L Restaurant'">T3L Restaurant</title>
    <link rel="stylesheet" th:href="@{/css/site.css(v=20261119)}" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" th:href="@{/}">
        <span class="brand-mark">T3L</span>
        <span>
          <b>T3L Restaurant</b>
          <small>Hương vị cho những dịp đáng nhớ</small>
        </span>
      </a>
      <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/menu}">Thực đơn</a>
        <a th:href="@{/faq}">FAQ</a>
        <a th:href="@{/login}">Đăng nhập</a>
        <a class="button button-small" th:href="@{/reservations/new}"
          >Đặt bàn</a
        >
      </nav>
    </header>
    <main>
      <div th:fragment="footer">
        <footer class="footer">
          <span>T3L Restaurant · Phục vụ tận tâm, mỗi ngày.</span>
          <span>Đặt bàn trực tuyến · 08:00–22:00</span>
        </footer>
      </div>
    </main>
  </body>
</html>
