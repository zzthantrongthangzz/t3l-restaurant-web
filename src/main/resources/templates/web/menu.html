<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Xem thực đơn T3L Restaurant, tìm món và chọn món ăn cho lịch đặt bàn." />
  <title>Thực đơn | T3L Restaurant</title>
  <link rel="stylesheet" th:href="@{/css/home.css(v=20261120-typography)}" />
  <link rel="stylesheet" th:href="@{/css/menu.css(v=shared-dish-cards)}" />
  <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
  <script defer th:src="@{/js/menu.js(v=quantity-controls)}"></script>
</head>
<body class="home menu-page">
  <a class="skip-link" href="#main">Chuyển đến thực đơn</a>
  <header th:replace="~{web/fragments/restaurant-shell :: header('menu')}"></header>
  <main class="menu-workspace" id="main">
    <section class="menu-catalog" aria-labelledby="menu-title">
      <div class="menu-heading">
        <div>
          <h1 id="menu-title">Thực đơn</h1>
          <p class="menu-count" role="status"><span id="menu-result-count" th:text="${dishCount}"></span> món</p>
        </div>
        <div class="menu-search" role="search" hidden>
          <svg th:replace="~{web/fragments/restaurant-shell :: icon('search')}"></svg>
          <input id="menu-search" type="search" aria-label="Tìm món" placeholder="Nhập tên món…" maxlength="140" />
        </div>
      </div>
      <div sec:authorize="hasRole('ADMIN')" class="menu-admin-tools" th:if="${menuBooking == null}">
        <a class="menu-primary" th:href="@{/admin/dishes/new}">Thêm món</a>
        <a class="menu-secondary" th:href="@{/admin/categories}">Danh mục</a>
      </div>
      <p class="menu-message" th:if="${notice != null}" th:text="${notice}" role="status"></p>
      <p class="menu-message is-error" th:if="${error != null}" th:text="${error}" role="alert"></p>
      <nav class="menu-categories" aria-label="Danh mục món" hidden>
        <button type="button" data-category="" aria-pressed="true">Tất cả</button>
        <button type="button" th:each="group, state : ${dishGroups}" th:attr="data-category=${state.index}"
                th:text="${group.key}" aria-pressed="false"></button>
      </nav>

      <section class="menu-category" th:each="group, state : ${dishGroups}"
               th:attr="data-group=${state.index},aria-labelledby=${'menu-group-' + state.index}">
        <h2 th:id="${'menu-group-' + state.index}" th:text="${group.key}"></h2>
        <div class="menu-grid">
          <th:block th:each="dish : ${group.value}">
            <article th:replace="~{web/fragments/dish-cards :: card(${dish}, ${menuBooking != null},
                       ${menuBooking != null and menuOrderedDishIds.contains(dish.id)},
                       ${hiddenCategories != null and hiddenCategories.contains(dish.categoryName)})}"></article>
          </th:block>
        </div>
      </section>
      <p id="menu-no-results" class="menu-message" th:hidden="${dishCount != 0}"
         th:text="${dishCount == 0 ? 'Thực đơn đang được cập nhật.' : 'Chưa tìm thấy món phù hợp.'}"></p>
    </section>

    <aside class="menu-booking" id="menu-booking" tabindex="-1" aria-labelledby="menu-booking-title">
      <h2 id="menu-booking-title" th:text="${menuBooking == null ? 'Đặt bàn tại T3L' : 'Đơn của lượt đặt bàn'}"></h2>
      <div th:if="${menuBooking != null}" class="menu-order-reference">
        <strong th:text="${menuBooking.code}"></strong>
        <p th:if="${menuOrder != null}" th:text="${menuOrder.invoiceNumber}"></p>
      </div>
      <ul th:if="${menuOrder != null and menuOrder.hasItems()}" class="menu-saved-items" aria-label="Món đã lưu">
        <li th:each="item : ${menuOrder.items}" th:unless="${item.cancelled}">
          <span th:text="${item.dishName + ' × ' + item.quantity}"></span>
          <strong th:text="${#numbers.formatInteger(item.amount,1,'POINT') + ' ₫'}"></strong>
          <small class="menu-item-note" th:if="${item.note != null}" th:text="${item.note}"></small>
        </li>
      </ul>
      <form th:if="${menuBooking != null}" id="menu-preorder"
            th:action="@{/reservations/{code}/preorder(code=${menuBooking.code})}" method="post">
        <div class="menu-selection-items" aria-live="polite">
          <p id="menu-selection-empty">Chọn món để thêm vào đơn của bàn này.</p>
          <ul id="menu-selection" aria-label="Món sẽ thêm"></ul>
        </div>
        <div class="menu-total"><span>Tạm tính món thêm</span><output id="menu-total" aria-live="polite">0 ₫</output></div>
        <button class="menu-primary" type="submit" disabled>Lưu món vào đơn</button>
        <a class="menu-secondary" th:href="@{${bookingReturn}}">Về chi tiết đặt bàn</a>
      </form>
      <div th:if="${menuBooking == null}" class="menu-booking-links">
        <p>Chọn bàn để bắt đầu đặt chỗ.</p>
        <a class="menu-primary" th:href="@{/reservations/new}">Xem bàn trống</a>
      </div>
    </aside>
    <a th:if="${menuBooking != null}" class="menu-selection-shortcut menu-primary" id="menu-selection-shortcut"
       href="#menu-booking" hidden>Xem món đã chọn (<span id="menu-selection-count">0</span>)</a>
  </main>
  <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>

  <dialog th:replace="~{web/fragments/dish-cards :: detailDialog}"></dialog>
  <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
</body>
</html>
