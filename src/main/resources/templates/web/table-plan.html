<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chọn bàn | T3L Restaurant</title>
    <th:block th:replace="~{web/fragments/theme :: start}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="stylesheet" th:href="@{/css/reservation.css}" />
    <link rel="stylesheet" th:href="@{/css/account.css}" />
    <link rel="stylesheet" th:href="@{/css/table-plan.css(v=2)}" />
    <link rel="stylesheet" th:if="${selectedTable != null and !showBookingProfile}" th:href="@{/css/preorder.css}" />
    <th:block th:replace="~{web/fragments/theme :: assets}"></th:block>
    <link rel="stylesheet" th:if="${selectedTable != null and !showBookingProfile}" th:href="@{/css/booking-checkout.css}" />
  </head>
  <body class="home table-plan-page">
    <header th:replace="~{web/fragments/restaurant-shell :: header('reservation')}"></header>
    <th:block th:if="${selectedTable != null and !showBookingProfile}">
      <main th:replace="~{web/fragments/booking-checkout :: checkout}"></main>
    </th:block>
    <main th:if="${selectedTable == null or showBookingProfile}" data-navigation class="home-container table-plan-main">
      <div class="table-plan-heading">
        <div><h1>Chọn bàn cho buổi hẹn</h1>
          <p>Chọn ngày, giờ đến và số khách để xem bàn phù hợp.</p>
          <p th:if="${bookingCustomer and !bookingProfileMissing}" th:text="${'Đặt bàn cho ' + bookingName}"></p></div>
        <form class="table-plan-date" method="get" th:action="@{/reservations/new}">
          <input type="hidden" name="draft" th:if="${bookingDraft != null}" th:value="${bookingDraft}" />
          <input type="hidden" name="choose" value="true" />
          <label>Ngày đến <input type="date" name="date" th:value="${selectedDate}" th:min="${today}" required /></label>
          <label>Giờ đến
            <select name="time">
              <option value="" th:if="${timeSlots.isEmpty()}">Hết khung giờ</option>
              <option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${#temporals.format(slot,'HH:mm')}" th:selected="${slot == selectedTime}"></option>
            </select>
          </label>
          <label>Số khách <input type="number" name="guests" min="1" max="20" th:value="${selectedGuests}" required /></label>
          <button class="home-button" type="submit">Xem sơ đồ</button>
        </form>
      </div>
      <p th:if="${bookingNotice != null}" class="plan-dialog-note" role="status" th:text="${bookingNotice}"></p>
      <div th:if="${selectedTable == null}" th:object="${form}">
        <p class="plan-form-error" th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
      </div>
      <p class="table-plan-privacy" th:if="${selectedTime != null}"
          th:text="${'Khung giờ ' + #temporals.format(selectedTime, 'HH:mm') + ' – ' + #temporals.format(selectedTime.plusMinutes(duration), 'HH:mm') + ' · ' + duration + ' phút'}"></p>
      <p class="plan-dialog-note" th:if="${selectedTime == null}" role="status">Ngày đã chọn không còn khung giờ đặt bàn. Vui lòng chọn ngày khác.</p>
      <p class="plan-dialog-note" th:if="${selectedTime != null and tables.isEmpty()}" role="status">Hiện chưa có bàn đang phục vụ.</p>
      <ul class="table-plan-legend" aria-label="Trạng thái bàn">
        <li><span class="plan-dot is-free"></span>Trống</li><li><span class="plan-dot is-booked"></span>Đã có người đặt</li>
      </ul>
      <div class="table-plan-grid">
        <article class="plan-table-card" th:each="item : ${tables}" th:if="${item.table.capacity >= selectedGuests}"
            th:with="booked=${item.state != 'FREE'},prefix=${booked ? 'banDo' : 'banXam'},
              tableImage=${prefix + (item.vip ? '_vip.png' : '_thuong.png')}"
            th:classappend="${booked ? 'is-booked' : 'is-free'}">
          <a th:if="${item.state == 'FREE'}" class="plan-table-hit"
              th:href="@{/reservations/new(date=${selectedDate},time=${selectedTime},guests=${selectedGuests},tableId=${item.table.id},draft=${bookingDraft})} + '#main'"
              th:aria-label="${'Chọn bàn ' + item.table.code + ', ' + item.label}"></a>
          <img class="plan-table-image" th:src="@{/images/tables/{image}(image=${tableImage})}" alt="" width="120" height="84" />
          <h2 th:text="${item.table.code}"></h2><p class="plan-table-meta" th:text="${item.table.capacity + ' chỗ · ' + item.table.kind.label}"></p>
          <span class="plan-table-state" th:text="${booked ? 'Đã có người đặt' : item.label}"></span>
        </article>
      </div>
      <p class="table-plan-privacy">Thông tin khách đặt chỉ hiển thị với nhân viên và quản lý nhà hàng.</p>
    </main>
    <footer th:replace="~{web/fragments/restaurant-shell :: footer}"></footer>

    <th:block th:if="${showBookingProfile}"><dialog th:replace="~{web/reservation-form :: profileDialog(true)}"></dialog></th:block>
    <script th:replace="~{web/fragments/restaurant-shell :: navigation}"></script>
    <th:block th:if="${selectedTable != null and !showBookingProfile}">
      <script data-page-script defer th:src="@{/js/preorder.js}"></script>
      <script data-page-script defer th:src="@{/js/booking-checkout.js}"></script>
    </th:block>
    <script th:if="${showBookingProfile}" data-page-script defer th:src="@{/js/public-table-plan.js(v=2)}"></script>
  </body>
</html>
