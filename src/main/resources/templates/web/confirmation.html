<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{web/layout :: head('Xác nhận đặt bàn')}"> </head>
  <body>
    <header class="topbar">
      <a class="brand" th:href="@{/}">
        <span class="brand-mark">T3L</span>
        <span>
          <b>T3L Restaurant</b>
          <small>Hương vị cho những dịp đáng nhớ</small>
        </span>
      </a>
      <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/menu}">Thực đơn</a>
        <a th:href="@{/faq}">FAQ</a>
        <a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff/reservations}">Quản lý</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Đăng nhập</a>
        <form class="topbar-logout" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
          <button class="text-button" type="submit">Đăng xuất</button>
        </form>
      </nav>
    </header>
    <main class="page inner-page">
      <section class="confirmation">
        <span class="confirm-icon">✓</span>
        <span class="eyebrow">ĐÃ GHI NHẬN YÊU CẦU</span>
        <h1>Cảm ơn bạn đã chọn T3L</h1>
        <p>Nhân viên sẽ liên hệ để xác nhận chỗ ngồi.</p>
        <div class="confirm-details">
          <div>
            <small>Mã đặt bàn</small>
            <b th:text="${reservation.code}">T3L-12345678</b>
          </div>
          <div>
            <small>Bàn đã chọn</small>
            <b th:text="${reservation.table != null ? reservation.table.code : 'Chưa chọn bàn'}">Bàn 001</b>
          </div>
          <div>
            <small>Ngày và giờ</small>
            <b
              th:text="${reservation.reservationDate + ' · ' + reservation.reservationTime}"
              >Ngày</b
            >
          </div>
          <div>
            <small>Số khách</small>
            <b th:text="${reservation.guestCount + ' khách'}"> </b>
          </div>
          <div>
            <small>Trạng thái</small>
            <b class="status" th:text="${reservation.status}">PENDING</b>
          </div>
        </div>
        <a class="button" th:href="@{/}">Về trang chủ</a>
      </section>
      <footer class="footer">
        <span>T3L Restaurant</span>
      </footer>
    </main>
  </body>
</html>
