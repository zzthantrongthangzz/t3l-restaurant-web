<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section th:fragment="invitation" class="about-invitation" aria-labelledby="invitation-title">
      <div class="home-container" data-reveal><p class="home-eyebrow">MỘT CUỘC HẸN ĐANG CHỜ</p><h2 id="invitation-title">Hẹn bạn bên bàn ăn.<br /><em>Để T3L đón tiếp.</em></h2><p>Chọn thời gian và số khách. T3L sẽ sắp xếp bàn phù hợp cho bạn.</p><div><a class="home-button" th:href="@{/reservations/new}">Đặt bàn ngay <span aria-hidden="true">↗</span></a><a class="home-text-link" th:href="@{/reservations/lookup}">Tra cứu đặt bàn <span aria-hidden="true">→</span></a></div></div>
    </section>
    <script th:fragment="effects">
      (() => {
        if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const observer = new IntersectionObserver(entries => entries.forEach(entry => {
            if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
          }), { threshold: 0.08 });
          document.querySelectorAll('[data-reveal]').forEach(element => { element.classList.add('reveal-ready'); observer.observe(element); });
        }
        const form = document.getElementById('contact-form');
        if (!form) return;
        if (form.dataset.hasErrors === 'true') form.querySelector('[aria-invalid="true"], .contact-form-error')?.focus();
        form.addEventListener('submit', () => {
          const button = form.querySelector('button[type="submit"]');
          button.disabled = true; button.textContent = 'Đang gửi lời nhắn…';
        });
        window.addEventListener('pageshow', () => {
          const button = form.querySelector('button[type="submit"]');
          button.disabled = false; button.innerHTML = 'Gửi lời nhắn <span aria-hidden="true">↗</span>';
        });
      })();
    </script>
  </body>
</html>
