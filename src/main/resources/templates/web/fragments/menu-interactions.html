<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <script th:fragment="script">
      (() => {
        const cards = [...document.querySelectorAll('.menu-card')];
        const groups = [...document.querySelectorAll('.menu-category')];
        const filters = [...document.querySelectorAll('[data-category].category-button')];
        const search = document.getElementById('menu-search');
        const resultCount = document.getElementById('menu-result-count');
        const noResults = document.getElementById('menu-no-results');
        const dialog = document.getElementById('dish-dialog');
        let selectedCategory = '';
        let lastDetailButton = null;
        const normalize = (value) => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLocaleLowerCase('vi').trim();
        const searchableNames = new Map(cards.map(card => [card, normalize(card.dataset.name)]));

        const updateResults = () => {
          const query = normalize(search.value);
          let visibleCount = 0;
          cards.forEach((card) => {
            const matches = (!selectedCategory || card.dataset.category === selectedCategory)
              && searchableNames.get(card).includes(query);
            card.hidden = !matches;
            if (matches) visibleCount++;
          });
          groups.forEach((group) => {
            const count = [...group.querySelectorAll('.menu-card')].filter(card => !card.hidden).length;
            group.hidden = count === 0;
            group.querySelector('[data-group-count]').textContent = String(count);
          });
          resultCount.textContent = String(visibleCount);
          noResults.hidden = visibleCount > 0 || cards.length === 0;
          filters.forEach((button) => {
            const selected = button.dataset.category === selectedCategory;
            button.classList.toggle('is-selected', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
        };

        if (cards.length) {
          document.querySelector('.menu-tools').hidden = false;
          filters.forEach((button) => button.addEventListener('click', () => {
            selectedCategory = button.dataset.category;
            updateResults();
            document.getElementById('menu-catalog').scrollIntoView({ block: 'start' });
          }));
          search.addEventListener('input', updateResults);
          document.getElementById('menu-reset').addEventListener('click', () => {
            search.value = '';
            selectedCategory = '';
            updateResults();
            search.focus({ preventScroll: true });
          });
        }

        document.querySelectorAll('img[data-fallback]').forEach((img) => {
          const fallback = () => {
            img.src = img.dataset.fallback;
            const note = img.parentElement.querySelector('.menu-image-note, .menu-banner-credit');
            if (note) note.hidden = false;
            img.alt = img.classList.contains('menu-banner-image')
              ? 'Steak nướng cùng sốt và hương thảo — ảnh minh họa'
              : 'Ảnh món ăn đang được cập nhật';
          };
          img.addEventListener('error', fallback, { once: true });
          if (img.complete && img.naturalWidth === 0) fallback();
        });

        if (typeof dialog.showModal === 'function') {
          cards.forEach((card) => {
            const button = card.querySelector('[data-open-dish]');
            button.hidden = false;
            button.addEventListener('click', () => {
              document.getElementById('dish-detail-title').textContent = card.dataset.name;
              document.getElementById('dish-detail-category').textContent = card.dataset.category;
              document.getElementById('dish-detail-description').textContent = card.querySelector('.menu-card-description').textContent;
              document.getElementById('dish-detail-price').textContent = card.querySelector('.menu-card-price').textContent;
              const dietary = card.querySelector('.menu-card-dietary');
              const detailDietary = document.getElementById('dish-detail-dietary');
              detailDietary.textContent = dietary ? dietary.textContent : '';
              detailDietary.hidden = !dietary;
              const image = card.querySelector('.menu-card-image img').cloneNode(true);
              image.loading = 'eager';
              image.removeAttribute('data-fallback');
              const note = card.querySelector('.menu-image-note');
              const imageContainer = document.getElementById('dish-detail-image');
              imageContainer.replaceChildren(image);
              if (!note.hidden) imageContainer.append(note.cloneNode(true));
              image.addEventListener('error', () => {
                image.src = card.querySelector('img').dataset.fallback;
                image.alt = 'Ảnh món ăn đang được cập nhật';
                if (!imageContainer.querySelector('.menu-image-note')) {
                  const detailNote = note.cloneNode(true);
                  detailNote.hidden = false;
                  imageContainer.append(detailNote);
                }
              }, { once: true });
              lastDetailButton = button;
              dialog.showModal();
              document.documentElement.classList.add('dish-dialog-open');
            });
          });
          dialog.addEventListener('close', () => {
            document.documentElement.classList.remove('dish-dialog-open');
            lastDetailButton?.focus({ preventScroll: true });
          });
          dialog.addEventListener('click', (event) => {
            if (event.target !== dialog) return;
            const rect = dialog.getBoundingClientRect();
            if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
          });
        }
      })();
    </script>
  </body>
</html>
