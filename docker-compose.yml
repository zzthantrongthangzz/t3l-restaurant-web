services:
  mysql:
    image: mysql:8.4
    container_name: t3l-restaurant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-t3l_restaurant}
      MYSQL_USER: ${MYSQL_USER:-t3l_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-db-password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - t3l_mysql_data:/var/lib/mysql
      - ./database/mysql/01_schema_seed.sql:/docker-entrypoint-initdb.d/01_schema_seed.sql:ro
      - ./database/mysql/04_menu_catalog_seed.sql:/docker-entrypoint-initdb.d/04_menu_catalog_seed.sql:ro
      - ./database/mysql/06_reservation_timeslots.sql:/docker-entrypoint-initdb.d/06_reservation_timeslots.sql:ro
      - ./database/mysql/07_reservation_change_requests.sql:/docker-entrypoint-initdb.d/07_reservation_change_requests.sql:ro
      - ./database/mysql/08_contact_messages.sql:/docker-entrypoint-initdb.d/08_contact_messages.sql:ro
      - ./database/mysql/09_customer_registration.sql:/docker-entrypoint-initdb.d/09_customer_registration.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: t3l-restaurant-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - t3l_mongo_data:/data/db
      - ./database/mongodb/01_faq_seed.js:/docker-entrypoint-initdb.d/01_faq_seed.js:ro

volumes:
  t3l_mysql_data:
  t3l_mongo_data:
