services:
  mysql:
    image: mysql:8.4
    container_name: t3l-restaurant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-t3l_restaurant}
      MYSQL_USER: ${MYSQL_USER:-t3l_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-db-password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - t3l_mysql_data:/var/lib/mysql
      - ./database/mysql/01_schema_seed.sql:/docker-entrypoint-initdb.d/01_schema_seed.sql:ro
      - ./database/mysql/04_menu_catalog_seed.sql:/docker-entrypoint-initdb.d/04_menu_catalog_seed.sql:ro
      - ./database/mysql/06_reservation_timeslots.sql:/docker-entrypoint-initdb.d/06_reservation_timeslots.sql:ro
      - ./database/mysql/07_reservation_change_requests.sql:/docker-entrypoint-initdb.d/07_reservation_change_requests.sql:ro
      - ./database/mysql/08_contact_messages.sql:/docker-entrypoint-initdb.d/08_contact_messages.sql:ro
      - ./database/mysql/09_customer_registration.sql:/docker-entrypoint-initdb.d/09_customer_registration.sql:ro
      - ./database/mysql/10_customer_accounts.sql:/docker-entrypoint-initdb.d/10_customer_accounts.sql:ro
      - ./database/mysql/11_sms_customer_login.sql:/docker-entrypoint-initdb.d/11_sms_customer_login.sql:ro
      - ./database/mysql/12_reservation_emails.sql:/docker-entrypoint-initdb.d/12_reservation_emails.sql:ro
      - ./database/mysql/13_staff_operations.sql:/docker-entrypoint-initdb.d/13_staff_operations.sql:ro
      - ./database/mysql/14_admin_workspace.sql:/docker-entrypoint-initdb.d/14_admin_workspace.sql:ro
      - ./database/mysql/15_reservation_deposits.sql:/docker-entrypoint-initdb.d/15_reservation_deposits.sql:ro
      - ./database/mysql/16_table_kinds.sql:/docker-entrypoint-initdb.d/16_table_kinds.sql:ro
      - ./database/mysql/17_menu_images.sql:/docker-entrypoint-initdb.d/17_menu_images.sql:ro
      - ./database/mysql/18_deposit_settlement.sql:/docker-entrypoint-initdb.d/18_deposit_settlement.sql:ro
      - ./database/mysql/19_preorder_cart.sql:/docker-entrypoint-initdb.d/19_preorder_cart.sql:ro
      - ./database/mysql/20_sepay_payments.sql:/docker-entrypoint-initdb.d/20_sepay_payments.sql:ro
      - ./database/mysql/21_user_tracking.sql:/docker-entrypoint-initdb.d/21_user_tracking.sql:ro
      - ./database/mysql/22_vouchers.sql:/docker-entrypoint-initdb.d/22_vouchers.sql:ro
      - ./database/mysql/23_operating_data.sql:/docker-entrypoint-initdb.d/23_operating_data.sql:ro
      - ./database/mysql/25_operating_examples.sql:/docker-entrypoint-initdb.d/25_operating_examples.sql:ro
      - ./database/mysql/26_reservation_email_checks.sql:/docker-entrypoint-initdb.d/26_reservation_email_checks.sql:ro
      - ./database/mysql/27_table_capacities.sql:/docker-entrypoint-initdb.d/27_table_capacities.sql:ro
      - ./database/mysql/28_employee_audit.sql:/docker-entrypoint-initdb.d/28_employee_audit.sql:ro
      - ./database/mysql/30_large_tables.sql:/docker-entrypoint-initdb.d/30_large_tables.sql:ro
      - ./database/mysql/31_operating_workflows.sql:/docker-entrypoint-initdb.d/31_operating_workflows.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2m

  mongodb:
    image: mongo:7
    container_name: t3l-restaurant-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - t3l_mongo_data:/data/db
      - ./database/mongodb/01_faq_seed.js:/docker-entrypoint-initdb.d/01_faq_seed.js:ro

  mongodb-vector:
    image: mongodb/mongodb-atlas-local:8.0
    profiles: ["atlas-local"]
    hostname: mongodb-vector
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - t3l_vector_data:/data/db
      - t3l_vector_config:/data/configdb
      - t3l_vector_search:/data/mongot

volumes:
  t3l_mysql_data:
  t3l_mongo_data:
  t3l_vector_data:
  t3l_vector_config:
  t3l_vector_search:
